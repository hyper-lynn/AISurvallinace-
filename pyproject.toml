[project]
name = "ShadowEYE"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Lynn Myat Aung", email = "lynnmyat49@gmail.com" }
]
dependencies = [
    "faiss-cpu>=1.7.4",
    "flet-camera>=0.86.1",
    "flet[all]>=0.85.3",
    "numpy>=1.26.0",
    "ollama>=0.6.2",
    "onnxruntime-gpu>=1.19.0,<1.20.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.32",
    "torch",
    "ultralytics",
]

[dependency-groups]
dev = [
    "flet-cli>=0.85.3",
    "flet-desktop>=0.85.3",
    "flet-web>=0.85.3",
]

[tool.flet]
org = "com.rangoonx.com"
product = "Shadow EYE"
company = "Rangoon X,Inc"
copyright = "Copyright (C) 2026 by Rangoon X, Inc."
flutter_build_args = ["--enable-experiment=native-assets"]

[tool.flet.app]
path = "src"
module = "mobile_view"
